name: Suggestion
description: An idea for a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like GraphSandbox to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would it help?
    validations:
      required: false
