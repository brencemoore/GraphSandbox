name: Bug report
description: Something on GraphSandbox doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: "I added three nodes, opened Analyze, and the Spectral tab showed an error."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "e.g. Windows laptop, Chrome / iPhone, Safari"
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or a saved graph file (JSON) help a lot. You can drag them into this box.
    validations:
      required: false
