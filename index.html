<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GraphSandbox</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="vh-100 d-flex flex-column">

    <!-- Header -->
    <header class="d-flex align-items-center gap-4 px-4 py-3 border-bottom bg-body flex-shrink-0">

        <a class="d-flex align-items-center gap-2 fs-4 fw-semibold text-body text-decoration-none" href="#">
            <i class="bi bi-share-fill text-accent"></i>
            <span>Graph<span class="text-accent">Sandbox</span></span>
        </a>

        <span class="d-flex align-items-center gap-2 small text-body-secondary">
            <span
                class="p-1 rounded-circle d-inline-block bg-warning"
                id="pythonStatusDot">
            </span>
            <span id="pythonStatusText">Loading Python…</span>
        </span>

        <div class="d-flex align-items-center gap-2 ms-auto">

            <button
                class="btn btn-link text-body-secondary fs-5"
                id="undo"
                title="Undo (Ctrl+Z)">
                <i class="bi bi-arrow-90deg-left"></i>
            </button>

            <button
                class="btn btn-link text-body-secondary fs-5"
                id="redo"
                title="Redo (Ctrl+Y)">
                <i class="bi bi-arrow-90deg-right"></i>
            </button>

            <div class="vr mx-2"></div>

            <button
                class="btn btn-outline-secondary"
                id="newGraph">
                New graph
            </button>

            <button
                class="btn btn-outline-secondary"
                data-bs-toggle="modal"
                data-bs-target="#settingsModal"
                title="Settings">
                <i class="bi bi-gear"></i>
            </button>

            <button
                class="btn btn-accent"
                id="toggleAnalysis">
                <i class="bi bi-bar-chart-line me-1"></i>
                Analyze
            </button>

        </div>

    </header>


    <!-- Main Application -->
    <main class="d-flex flex-grow-1 overflow-hidden">

        <!-- Tool Rail -->
        <nav class="tool-rail d-flex flex-column gap-2 p-2 border-end bg-body flex-shrink-0">

            <button
                class="btn tool-button d-flex flex-column align-items-center gap-1 py-2"
                data-tool="select">
                <i class="bi bi-cursor fs-5"></i>
                Select
            </button>

            <button
                class="btn tool-button d-flex flex-column align-items-center gap-1 py-2"
                data-tool="node">
                <i class="bi bi-crosshair fs-5"></i>
                Add node
            </button>

            <button
                class="btn tool-button d-flex flex-column align-items-center gap-1 py-2"
                data-tool="edge">
                <i class="bi bi-bezier2 fs-5"></i>
                Connect nodes
            </button>

            <button
                class="btn tool-button d-flex flex-column align-items-center gap-1 py-2"
                data-tool="pan">
                <i class="bi bi-arrows-move fs-5"></i>
                Pan canvas
            </button>

            <hr class="mx-3 my-1">

            <button
                class="btn tool-button tool-button-danger d-flex flex-column align-items-center gap-1 py-2 mt-auto"
                id="deleteSelected"
                title="Delete selection (Del)">
                <i class="bi bi-trash3 fs-5"></i>
                Delete
            </button>

        </nav>


        <!-- Workspace -->
        <section class="flex-grow-1 position-relative">

            <!-- Graph Canvas -->
            <div
                class="graph-canvas show-grid position-absolute top-0 start-0 w-100 h-100"
                id="graphCanvas">
            </div>


            <!-- Edge Preview -->
            <svg
                class="position-absolute top-0 start-0 w-100 h-100 pe-none text-accent d-none"
                id="edgePreview">
                <line
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-dasharray="8 6"
                    stroke-linecap="round" />
            </svg>


            <!-- Empty State -->
            <div
                class="position-absolute top-50 start-50 translate-middle text-center pe-none"
                id="emptyCanvas">

                <i class="bi bi-share display-4 text-body-secondary"></i>

                <h5 class="mt-3">
                    Start a graph
                </h5>

                <p class="text-body-secondary mb-0">
                    Double-click the canvas to add a node
                </p>

            </div>


            <!-- Workspace Header and Inspector -->
            <div class="position-absolute top-0 start-0 m-4 d-flex flex-column align-items-start gap-3 pe-none">

                <div class="d-flex align-items-center gap-3">
                    <span class="fs-5 fw-semibold">Graph workspace</span>
                    <div class="vr"></div>
                    <span
                        class="text-body-secondary"
                        id="graphCounts">
                        0 nodes · 0 edges
                    </span>
                </div>

                <div
                    class="card shadow-sm inspector pe-auto d-none"
                    id="inspector">

                    <div class="card-body">

                        <h6
                            class="card-title mb-3"
                            id="inspectorTitle">
                        </h6>

                        <label
                            class="form-label small text-body-secondary"
                            for="elementName">
                            Name
                        </label>

                        <input
                            class="form-control form-control-sm"
                            id="elementName"
                            autocomplete="off">

                        <div
                            class="mt-2"
                            id="edgeValueField">

                            <label
                                class="form-label small text-body-secondary"
                                for="edgeValue">
                                Value
                            </label>

                            <input
                                class="form-control form-control-sm"
                                id="edgeValue"
                                type="number"
                                step="any">

                        </div>

                    </div>

                </div>

            </div>


            <!-- Tool Hint -->
            <div class="position-absolute bottom-0 start-50 translate-middle-x mb-4 px-4 py-2 bg-body border rounded-pill shadow-sm small d-flex align-items-center gap-2 text-nowrap">
                <span class="p-1 rounded-circle d-inline-block bg-accent"></span>
                <span id="toolHint"></span>
            </div>


            <!-- Zoom Controls -->
            <div class="position-absolute bottom-0 end-0 m-4 btn-group bg-body shadow-sm">

                <button
                    class="btn btn-outline-secondary"
                    id="zoomOut"
                    title="Zoom out">
                    <i class="bi bi-dash-lg"></i>
                </button>

                <span
                    class="btn btn-outline-secondary pe-none"
                    id="zoomLevel">
                    100%
                </span>

                <button
                    class="btn btn-outline-secondary"
                    id="zoomIn"
                    title="Zoom in">
                    <i class="bi bi-plus-lg"></i>
                </button>

                <button
                    class="btn btn-outline-secondary"
                    id="fit"
                    title="Fit graph">
                    <i class="bi bi-fullscreen"></i>
                </button>

            </div>

        </section>


        <!-- Analysis Panel -->
        <aside
            class="analysis-panel d-flex flex-column border-start bg-body flex-shrink-0 d-none"
            id="analysisPanel">

            <div class="px-4 pt-4">

                <div class="d-flex justify-content-between align-items-start">

                    <div>
                        <div class="small fw-semibold text-uppercase text-accent">
                            Graph analysis
                        </div>
                        <h4 class="fw-semibold mb-0">
                            Explore your graph
                        </h4>
                    </div>

                    <div class="d-flex align-items-center gap-2">

                        <button
                            class="btn btn-sm btn-outline-secondary d-none"
                            id="refreshAnalysis">
                            <i class="bi bi-arrow-clockwise me-1"></i>
                            Refresh
                        </button>

                        <button
                            type="button"
                            class="btn-close"
                            id="closeAnalysis"
                            aria-label="Close">
                        </button>

                    </div>

                </div>

                <ul
                    class="nav nav-underline nav-fill mt-4"
                    role="tablist">

                    <li class="nav-item" role="presentation">
                        <button
                            class="nav-link active"
                            data-bs-toggle="tab"
                            data-bs-target="#metricsTab"
                            type="button"
                            role="tab">
                            Metrics
                        </button>
                    </li>

                    <li class="nav-item" role="presentation">
                        <button
                            class="nav-link"
                            data-bs-toggle="tab"
                            data-bs-target="#centralityTab"
                            type="button"
                            role="tab">
                            Centrality
                        </button>
                    </li>

                    <li class="nav-item" role="presentation">
                        <button
                            class="nav-link"
                            data-bs-toggle="tab"
                            data-bs-target="#matricesTab"
                            type="button"
                            role="tab">
                            Matrices
                        </button>
                    </li>

                    <li class="nav-item" role="presentation">
                        <button
                            class="nav-link"
                            data-bs-toggle="tab"
                            data-bs-target="#spectralTab"
                            type="button"
                            role="tab">
                            Spectral
                        </button>
                    </li>

                </ul>

            </div>

            <div class="tab-content flex-grow-1 overflow-auto p-4 border-top">

                <!-- Metrics -->
                <div
                    class="tab-pane fade show active"
                    id="metricsTab"
                    role="tabpanel"
                    data-analysis="graph_properties">
                    <div data-result></div>
                </div>


                <!-- Centrality -->
                <div
                    class="tab-pane fade"
                    id="centralityTab"
                    role="tabpanel">

                    <select class="form-select mb-4">
                        <option value="degree_centrality">Degree centrality</option>
                        <option value="betweenness_centrality">Betweenness centrality</option>
                        <option value="closeness_centrality">Closeness centrality</option>
                        <option value="harmonic_centrality">Harmonic centrality</option>
                        <option value="eigenvector_centrality">Eigenvector centrality</option>
                        <option value="pagerank">PageRank</option>
                    </select>

                    <div data-result></div>

                </div>


                <!-- Matrices -->
                <div
                    class="tab-pane fade"
                    id="matricesTab"
                    role="tabpanel">

                    <select class="form-select mb-4">
                        <option value="adjacency_matrix">Adjacency matrix</option>
                        <option value="degree_matrix">Degree matrix</option>
                        <option value="laplacian_matrix">Laplacian matrix</option>
                        <option value="normalized_laplacian_matrix">Normalized Laplacian matrix</option>
                        <option value="incidence_matrix">Incidence matrix</option>
                        <option value="oriented_incidence_matrix">Oriented incidence matrix</option>
                        <option value="distance_matrix">Distance matrix</option>
                    </select>

                    <div data-result></div>

                </div>


                <!-- Spectral -->
                <div
                    class="tab-pane fade"
                    id="spectralTab"
                    role="tabpanel">

                    <select class="form-select mb-4">
                        <option value="adjacency_spectrum">Adjacency matrix</option>
                        <option value="laplacian_spectrum">Laplacian matrix</option>
                        <option value="normalized_laplacian_spectrum">Normalized Laplacian matrix</option>
                    </select>

                    <div data-result></div>

                </div>

            </div>

        </aside>

    </main>


    <!-- Settings Modal -->
    <div
        class="modal fade"
        id="settingsModal"
        tabindex="-1"
        aria-labelledby="settingsModalLabel"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title" id="settingsModalLabel">
                        Settings
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                    </button>

                </div>

                <div class="modal-body">

                    <h6>Analysis</h6>

                    <div class="form-check form-switch mb-4">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="autoUpdateSetting"
                            data-setting="autoUpdate">

                        <label
                            class="form-check-label"
                            for="autoUpdateSetting">
                            Update results automatically when the graph changes
                        </label>

                    </div>


                    <h6>Default names</h6>

                    <!-- Node Names -->
                    <label class="form-label small text-body-secondary mb-1">
                        Nodes
                    </label>

                    <div class="d-flex gap-2">

                        <div class="btn-group flex-grow-1" role="group">

                            <input
                                class="btn-check"
                                type="radio"
                                name="nodeNames"
                                id="nodeNamesNumbers"
                                value="numbers"
                                data-setting="nodeNames">
                            <label
                                class="btn btn-outline-secondary"
                                for="nodeNamesNumbers">
                                Numbers
                            </label>

                            <input
                                class="btn-check"
                                type="radio"
                                name="nodeNames"
                                id="nodeNamesLetters"
                                value="letters"
                                data-setting="nodeNames">
                            <label
                                class="btn btn-outline-secondary"
                                for="nodeNamesLetters">
                                Letters
                            </label>

                            <input
                                class="btn-check"
                                type="radio"
                                name="nodeNames"
                                id="nodeNamesCustom"
                                value="custom"
                                data-setting="nodeNames">
                            <label
                                class="btn btn-outline-secondary"
                                for="nodeNamesCustom">
                                Prefix
                            </label>

                        </div>

                        <input
                            class="form-control w-25"
                            type="text"
                            id="nodePrefixSetting"
                            placeholder="v"
                            aria-label="Node name prefix"
                            data-setting="nodePrefix">

                    </div>

                    <div class="d-flex justify-content-between align-items-center gap-2 mt-1 mb-3">

                        <span
                            class="form-text mt-0"
                            id="nodeNamesPreview">
                        </span>

                        <button
                            type="button"
                            class="btn btn-sm btn-link text-accent text-decoration-none p-0"
                            id="renameNodes">
                            Rename existing nodes
                        </button>

                    </div>


                    <!-- Edge Names -->
                    <label class="form-label small text-body-secondary mb-1">
                        Edges
                    </label>

                    <div class="d-flex gap-2">

                        <div class="btn-group flex-grow-1" role="group">

                            <input
                                class="btn-check"
                                type="radio"
                                name="edgeNames"
                                id="edgeNamesNone"
                                value="none"
                                data-setting="edgeNames">
                            <label
                                class="btn btn-outline-secondary"
                                for="edgeNamesNone">
                                None
                            </label>

                            <input
                                class="btn-check"
                                type="radio"
                                name="edgeNames"
                                id="edgeNamesNumbers"
                                value="numbers"
                                data-setting="edgeNames">
                            <label
                                class="btn btn-outline-secondary"
                                for="edgeNamesNumbers">
                                Numbers
                            </label>

                            <input
                                class="btn-check"
                                type="radio"
                                name="edgeNames"
                                id="edgeNamesLetters"
                                value="letters"
                                data-setting="edgeNames">
                            <label
                                class="btn btn-outline-secondary"
                                for="edgeNamesLetters">
                                Letters
                            </label>

                            <input
                                class="btn-check"
                                type="radio"
                                name="edgeNames"
                                id="edgeNamesCustom"
                                value="custom"
                                data-setting="edgeNames">
                            <label
                                class="btn btn-outline-secondary"
                                for="edgeNamesCustom">
                                Prefix
                            </label>

                        </div>

                        <input
                            class="form-control w-25"
                            type="text"
                            id="edgePrefixSetting"
                            placeholder="e"
                            aria-label="Edge name prefix"
                            data-setting="edgePrefix">

                    </div>

                    <div class="d-flex justify-content-between align-items-center gap-2 mt-1 mb-4">

                        <span
                            class="form-text mt-0"
                            id="edgeNamesPreview">
                        </span>

                        <button
                            type="button"
                            class="btn btn-sm btn-link text-accent text-decoration-none p-0"
                            id="renameEdges">
                            Rename existing edges
                        </button>

                    </div>


                    <h6>Appearance</h6>

                    <div class="form-check form-switch">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="showLabelsSetting"
                            data-setting="showLabels">

                        <label
                            class="form-check-label"
                            for="showLabelsSetting">
                            Show node and edge labels
                        </label>

                    </div>

                    <div class="form-check form-switch">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="showGridSetting"
                            data-setting="showGrid">

                        <label
                            class="form-check-label"
                            for="showGridSetting">
                            Show grid
                        </label>

                    </div>

                    <div class="form-check form-switch">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="darkModeSetting"
                            data-setting="darkMode">

                        <label
                            class="form-check-label"
                            for="darkModeSetting">
                            Dark mode
                        </label>

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Close
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/cytoscape.min.js"></script>
    <script src="js/pyodide/pyodide.js"></script>

    <script src="js/settings.js"></script>
    <script src="js/graph/naming.js"></script>
    <script src="js/graph/marquee.js"></script>
    <script src="js/graph/edge-preview.js"></script>
    <script src="js/graph/canvas.js"></script>
    <script src="js/graph/history.js"></script>
    <script src="js/graph/tools.js"></script>
    <script src="js/graph/inspector.js"></script>
    <script src="js/graph/summary.js"></script>
    <script src="js/analysis/python-engine.js"></script>
    <script src="js/analysis/result-views.js"></script>
    <script src="js/analysis/analysis-panel.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
